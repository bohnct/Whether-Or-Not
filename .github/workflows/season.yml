# Nightly: add yesterday's rainfall to the growing-season totals (data/rain*)
name: Season rainfall

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC (noon in Saskatchewan), after EC publishes the daily analysis
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/season.py
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update season rainfall data" && git push)
