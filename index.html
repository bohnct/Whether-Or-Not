<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Weather</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Weather">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <button id="placeBtn" class="place-btn" aria-label="Change location">
        <b id="placeName" class="place-name">Choose a location</b>
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <!-- Environment Canada alerts, shown on every page -->
    <div id="alerts"></div>
  </header>

  <main>
    <!-- NOW: current values -->
    <section id="view-now" class="view" hidden>
      <div class="now-summary card">
        <div id="nowIcon"></div>
        <div class="now-temp"><span id="nowTemp">--</span><span class="deg">°</span></div>
        <div class="now-text">
          <p id="nowCond"></p>
        </div>
      </div>
      <div class="tiles" id="nowTiles"></div>
      <div class="card text-forecast" id="nowText"></div>
    </section>

    <!-- TODAY: 24 h back → 24 h ahead -->
    <section id="view-today" class="view" hidden>
      <div class="charts" data-window="today"></div>
    </section>

    <!-- WEEK: 2 days back → 7 days ahead -->
    <section id="view-week" class="view" hidden>
      <div class="charts" data-window="week"></div>
    </section>

    <!-- RADAR -->
    <section id="view-radar" class="view view-map" hidden>
      <div id="map"></div>
      <div class="map-tools">
        <div class="seg small" id="mapMode">
          <button data-mode="radar">Radar</button>
          <button data-mode="pressure">Pressure</button>
        </div>
        <button class="chip" id="labelsBtn" aria-pressed="true">Labels</button>
        <button class="chip icon-only" id="locateBtn" aria-label="Centre on location">
          <svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/></svg>
        </button>
      </div>
      <div class="seg small map-sub" id="radarType">
        <button data-type="rain">Rain</button>
        <button data-type="snow">Snow</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="player card">
        <button id="playBtn" class="icon-btn" aria-label="Play / pause">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" class="fill"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
        </button>
        <input type="range" id="frameSlider" min="0" max="0" value="0" aria-label="Map time">
        <span id="frameTime" class="frame-time">--:--</span>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view" hidden>
      <h2 class="view-title">Settings</h2>

      <div class="card set-group">
        <h3>Home location</h3>
        <p class="muted small" id="homeLabel">Not set</p>
        <div class="search">
          <input id="citySearch" type="search" placeholder="Search Canadian city…" autocomplete="off">
          <ul id="cityResults"></ul>
        </div>
      </div>

      <div class="card set-group">
        <h3>Saved locations</h3>
        <ul id="savedList"></ul>
        <div class="search">
          <input id="saveSearch" type="search" placeholder="Add a Canadian city…" autocomplete="off">
          <ul id="saveResults"></ul>
        </div>
      </div>

      <div class="card set-group">
        <h3>Display</h3>
        <label class="row">Theme
          <select id="setTheme">
            <option value="auto">Auto (sunrise / sunset)</option>
            <option value="day">Day</option>
            <option value="night">Night</option>
          </select>
        </label>
        <label class="row">Temperature
          <select id="setTemp"><option value="C">°C</option><option value="F">°F</option></select>
        </label>
        <label class="row">Wind
          <select id="setWind"><option value="kmh">km/h</option><option value="mph">mph</option></select>
        </label>
        <label class="row">Open app on
          <select id="setStartLoc"><option value="current">Current location</option><option value="home">Home</option></select>
        </label>
      </div>

      <div class="card set-group">
        <h3>Radar</h3>
        <label class="row">Default type
          <select id="setRadarType">
            <option value="auto">Auto (by temperature)</option>
            <option value="rain">Rain</option>
            <option value="snow">Snow</option>
          </select>
        </label>
        <label class="row">Opacity <input type="range" id="setOpacity" min="0.3" max="1" step="0.05"></label>
        <label class="row">Animation speed
          <select id="setSpeed"><option value="900">Slow</option><option value="500">Normal</option><option value="250">Fast</option></select>
        </label>
        <label class="row">Show town names <input type="checkbox" id="setLabels" class="switch"></label>
      </div>

      <p class="muted small center">Data: Environment and Climate Change Canada · Map © Esri, OpenStreetMap</p>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="now"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path class="mark" d="M12 12v6"/></svg>Now</button>
    <button data-view="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><rect class="fill" x="9" y="12" width="6" height="6"/></svg>Today</button>
    <button data-view="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path class="mark" d="M6 12v6M8 12v6M10 12v6M12 12v6M14 12v6M16 12v6M18 12v6"/></svg>Week</button>
    <button data-view="radar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><circle cx="12" cy="12.75" r="3.5"/><circle class="fill" cx="12" cy="12.75" r="1"/><path d="M12 5v2.5M12 18v2.5M3.5 12.75H6M18 12.75h2.5"/></svg>Map</button>
    <button data-view="settings"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M7 10h10M7 15.5h10"/><circle class="knob" cx="10" cy="10" r="1.8"/><circle class="knob" cx="14.5" cy="15.5" r="1.8"/></svg>Settings</button>
  </nav>

  <div id="locSheet" class="loc-sheet" hidden>
    <div class="loc-panel">
      <div class="loc-now"><b id="locTitle"></b><span id="locDesc"></span></div>
      <ul id="locList"></ul>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="cities.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
