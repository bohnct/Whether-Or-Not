<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Weather</title>
  <meta name="theme-color" content="#070b16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Weather">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="loc-switch" role="tablist" aria-label="Location">
      <button data-loc="current" role="tab">
        <svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" class="fill"/></svg>
        Current
      </button>
      <button data-loc="home" role="tab">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        Home
      </button>
    </div>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" aria-label="Toggle day / night">
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Shared header for the chart tabs -->
    <div class="place" id="place">
      <h1 id="placeName">—</h1>
      <p id="placeMeta" class="muted"></p>
    </div>

    <!-- NOW: 6 h back → 6 h ahead -->
    <section id="view-now" class="view" hidden>
      <div id="alerts"></div>
      <div class="now-summary card">
        <div id="nowIcon"></div>
        <div class="now-temp"><span id="nowTemp">--</span><span class="deg">°</span></div>
        <div class="now-text">
          <p id="nowCond"></p>
          <p id="nowFeels" class="muted small"></p>
        </div>
      </div>
      <div class="charts" data-window="now"></div>
    </section>

    <!-- TODAY: 24 h back → 24 h ahead -->
    <section id="view-today" class="view" hidden>
      <div class="card text-forecast" id="todayText"></div>
      <div class="charts" data-window="today"></div>
    </section>

    <!-- WEEK: 2 days back → 7 days ahead -->
    <section id="view-week" class="view" hidden>
      <div class="charts" data-window="week"></div>
    </section>

    <p class="muted small center" id="updated"></p>

    <!-- RADAR -->
    <section id="view-radar" class="view view-map" hidden>
      <div id="map"></div>
      <div class="map-tools">
        <div class="seg small" id="mapMode">
          <button data-mode="radar">Radar</button>
          <button data-mode="pressure">Pressure</button>
        </div>
        <button class="chip" id="labelsBtn" aria-pressed="true">Labels</button>
        <button class="chip icon-only" id="locateBtn" aria-label="Centre on location">
          <svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/></svg>
        </button>
      </div>
      <div class="seg small map-sub" id="radarType">
        <button data-type="rain">Rain</button>
        <button data-type="snow">Snow</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="player card">
        <button id="playBtn" class="icon-btn" aria-label="Play / pause">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" class="fill"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
        </button>
        <input type="range" id="frameSlider" min="0" max="0" value="0" aria-label="Map time">
        <span id="frameTime" class="frame-time">--:--</span>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view" hidden>
      <h2 class="view-title">Settings</h2>

      <div class="card set-group">
        <h3>Home location</h3>
        <p class="muted small" id="homeLabel">Not set</p>
        <div class="search">
          <input id="citySearch" type="search" placeholder="Search Canadian city…" autocomplete="off">
          <ul id="cityResults"></ul>
        </div>
        <button class="btn" id="useCurrentAsHome">Use my current location</button>
      </div>

      <div class="card set-group">
        <h3>Display</h3>
        <label class="row">Theme
          <select id="setTheme">
            <option value="auto">Auto (sunrise / sunset)</option>
            <option value="day">Day</option>
            <option value="night">Night</option>
          </select>
        </label>
        <label class="row">Temperature
          <select id="setTemp"><option value="C">°C</option><option value="F">°F</option></select>
        </label>
        <label class="row">Wind
          <select id="setWind"><option value="kmh">km/h</option><option value="mph">mph</option></select>
        </label>
        <label class="row">Open app on
          <select id="setStartLoc"><option value="current">Current location</option><option value="home">Home</option></select>
        </label>
      </div>

      <div class="card set-group">
        <h3>Radar</h3>
        <label class="row">Default type
          <select id="setRadarType">
            <option value="auto">Auto (by temperature)</option>
            <option value="rain">Rain</option>
            <option value="snow">Snow</option>
          </select>
        </label>
        <label class="row">Opacity <input type="range" id="setOpacity" min="0.3" max="1" step="0.05"></label>
        <label class="row">Animation speed
          <select id="setSpeed"><option value="900">Slow</option><option value="500">Normal</option><option value="250">Fast</option></select>
        </label>
        <label class="row">Show town names <input type="checkbox" id="setLabels" class="switch"></label>
      </div>

      <p class="muted small center">Data: Environment and Climate Change Canada · Map © Esri, OpenStreetMap</p>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="now"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>Now</button>
    <button data-view="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
    <button data-view="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
    <button data-view="radar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg>Radar</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="cities.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
